[package]
name = "minnow-core"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.45.1", features = [
    "sync",
    "rt-multi-thread",
    "net",
    "io-util",
    "time",
    "macros",
] }
tracing = "0.1.41"
futures = "0.3.31"
bincode = "1.3.3"
byteorder = "1.5.0"
bytes = "1.10.1"
dashmap = "6.1.0"
plonky2.workspace = true
hashbrown.workspace = true
serde.workspace = true

minnow-mt-plonky2 = { path = "../minnow-mt-plonky2" }
minnow-lib = { path = "../minnow-lib" }

[dev-dependencies]
tracing-test = "0.2.5"

[features]
fake = []
